# 上架商品过期天数，0 表示永不过期
expire-days: 3

# 过期检查周期（秒）
check-interval: 60

# 上架手续费：固定金额（如 100）或按售价百分比（如 "5%"）
listing-fee: "5%"

# 成交税（百分比，0-100），从卖家所得中扣除
sales-tax: 0

# 每位玩家最多同时上架数量，0 表示不限制
max-listings-per-player: 10

# 允许的售价范围
min-price: 1
max-price: 10000000

# 禁止上架的物品
blacklisted-materials: []

# 时间显示格式与时区
date-format: "yyyy-MM-dd HH:mm"
time-zone: "Asia/Shanghai"

messages:
  prefix: "<gold>[市场] "
  listed: "<green>上架成功！售价 <yellow>%price%</yellow>，手续费 <yellow>%fee%</yellow>。"
  need-item: "<red>请放入或手持要上架的物品。"
  need-price: "<red>请先设置价格。"
  no-money-fee: "<red>余额不足，上架手续费需要 <yellow>%fee%</yellow>。"
  blacklisted: "<red>该物品不允许上架。"
  price-invalid: "<red>价格无效或超出允许范围。"
  too-many: "<red>你上架的商品已达上限（<yellow>%max%</yellow>）。"
  bought: "<green>购买成功！花费 <yellow>%price%</yellow>，物品已发送至你的邮箱。"
  no-money: "<red>余额不足，需要 <yellow>%price%</yellow>。"
  is-mine: "<red>不能购买自己上架的商品。"
  not-mine: "<red>这不是你上架的商品。"
  saled: "<red>该商品已被买走或下架。"
  removed: "<green>下架成功，物品已发送至你的邮箱。"
  force-removed: "<green>已强制下架，物品已退回卖家邮箱。"
  mail-error: "<red>邮箱系统不可用，操作已取消。"
  economy-error: "<red>经济系统不可用，操作已取消。"
  first-page: "<gray>已经是第一页了。"
  last-page: "<gray>已经是最后一页了。"
  no-permission: "<red>你没有权限执行此操作。"
  player-not-found: "<red>找不到玩家：<white>%player%</white>。"
  reloaded: "<green>配置已重载。"
  error: "<red>操作失败，请稍后再试。"

  # 通过邮箱发送物品时的邮件内容（支持多行，每行一条）
  mail-expired-subject: "全球市场商品过期下架"
  mail-expired-content: |-
    <gray>你的商品已过期自动下架
    <gray>物品：<yellow>%item%</yellow> x<yellow>%amount%</yellow>
    <gray>物品已附在本邮件中，请右键领取。

  mail-removed-subject: "全球市场商品已下架"
  mail-removed-content: |-
    <gray>你的商品已成功下架
    <gray>物品：<yellow>%item%</yellow> x<yellow>%amount%</yellow>
    <gray>物品已附在本邮件中，请右键领取。

  mail-force-subject: "管理员下架了你的商品"
  mail-force-content: |-
    <gray>你的商品被管理员强制下架
    <gray>物品：<yellow>%item%</yellow> x<yellow>%amount%</yellow>
    <gray>物品已附在本邮件中，请右键领取。

  mail-bought-subject: "全球市场购买成功"
  mail-bought-content: |-
    <gray>购买成功
    <gray>物品：<yellow>%item%</yellow> x<yellow>%amount%</yellow>
    <gray>物品已附在本邮件中，请右键领取。

  mail-sold-subject: "全球市场商品售出"
  mail-sold-content: |-
    <gray>你的商品已售出
    <gray>物品：<yellow>%item%</yellow>
    <gray>收入 <yellow>%price%</yellow>（买家：<yellow>%buyer%</yellow>）
