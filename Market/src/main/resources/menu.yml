# ============ 通用背景 ============
# fill: true 时自动用该物品填充所有空槽（上架界面的物品格除外）
background:
  fill: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

# ============ 主菜单 ============
main:
  title: "<gold><bold>全球市场"
  rows: 3
  items:
    info:
      slot: 4
      material: COMPASS
      name: "<aqua>全球市场"
      lore:
        - "<gray>当前在售：<yellow>%count%</yellow> 件"
        - "<gray>上架手续费：<yellow>%fee%</yellow>"
    browse:
      slot: 10
      material: ENDER_CHEST
      name: "<dark_aqua>浏览市场"
      lore:
        - "<gray>查看所有玩家上架的物品"
        - "<gray>左键点击购买"
    my-listings:
      slot: 12
      material: CHEST
      name: "<light_purple>我的上架"
      lore:
        - "<gray>查看我上架的物品"
        - "<gray>点击可下架"
    sell:
      slot: 14
      material: GOLD_INGOT
      name: "<gold>上架物品"
      lore:
        - "<gray>打开上架界面"
    close:
      slot: 22
      material: BARRIER
      name: "<red>关闭"

# ============ 商品列表（浏览 / 我的上架） ============
list:
  browse-title: "<gold><bold>全部商品"
  mine-title: "<gold><bold>我的上架"
  rows: 6
  content-slots:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 28
    - 29
    - 30
    - 31
    - 32
    - 33
    - 34
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    - 43
  listing-lore:
    - ""
    - "<gray>售价：<yellow>%price%"
    - "<gray>数量：<yellow>%amount%"
    - "<gray>卖家：<yellow>%seller%"
    - "<gray>到期：<yellow>%expire_at%"
    - "<gray>左键购买 ｜ 右键强制下架"
  items:
    info:
      slot: 4
      material: COMPASS
      name: "<aqua>%title%"
      lore:
        - "<gray>共 <yellow>%count%</yellow> 件"
        - "<gray>第 <yellow>%page%/%pages%</yellow> 页"
    prev-button:
      slot: 48
      material: ARROW
      name: "<gray>上一页"
      lore:
        - "<gray>点击查看上一页"
    prev-button-disabled:
      material: GRAY_DYE
      name: "<gray>上一页"
      lore:
        - "<dark_gray>已经是第一页"
    next-button:
      slot: 50
      material: ARROW
      name: "<gray>下一页"
      lore:
        - "<gray>点击查看下一页"
    next-button-disabled:
      material: GRAY_DYE
      name: "<gray>下一页"
      lore:
        - "<dark_gray>已经是最后一页"
    back-button:
      slot: 45
      material: ARROW
      name: "<gray>返回市场菜单"
    close-button:
      slot: 53
      material: BARRIER
      name: "<red>关闭"

# ============ 上架界面 ============
sell:
  title: "<gold><bold>上架物品"
  rows: 5
  # 放入要上架的物品（放入多少即上架多少）
  item-slot: 13
  items:
    item-hint:
      slot: 11
      material: HOPPER
      name: "<aqua>放入要上架的物品"
      lore:
        - "<gray>放入多少即上架多少"
    info:
      slot: 4
      material: PAPER
      name: "<aqua>上架信息"
      lore:
        - "<gray>上架手续费：<yellow>%fee%</yellow>"
        - "<gray>有效期：<yellow>%expire_days%</yellow> 天"
        - "<gray>成交税：<yellow>%sales_tax%%"
    price-button:
      slot: 30
      material: GOLD_NUGGET
      name: "<gold>设置价格"
      lore:
        - "<gray>当前：<yellow>%price%"
        - "<gray>点击输入售价"
    confirm-button:
      slot: 39
      material: EMERALD
      name: "<green>确认上架"
      lore:
        - "<gray>扣除手续费后上架"
    cancel-button:
      slot: 41
      material: BARRIER
      name: "<red>取消"

# ============ 二次确认 ============
confirm:
  rows: 3
  item-slot: 4
  confirm-slot: 10
  cancel-slot: 16
  cancel:
    material: BARRIER
    name: "<red>取消"
  buy:
    title: "<gold><bold>确认购买"
    button:
      material: GOLD_INGOT
      name: "<green>确认购买"
      lore:
        - "<gray>花费：<yellow>%price%"
        - "<gray>物品将发送至你的邮箱"
  remove:
    title: "<gold><bold>确认下架"
    button:
      material: GOLD_INGOT
      name: "<green>确认下架"
      lore:
        - "<gray>下架不退还手续费"
        - "<gray>物品将发送至你的邮箱"
  force:
    title: "<red><bold>确认强制下架"
    button:
      material: GOLD_INGOT
      name: "<red>确认强制下架"
      lore:
        - "<gray>物品将退回卖家邮箱"

# ============ 价格输入对话框 ============
dialogs:
  price:
    title: "<gold>设置价格"
    label: "<gray>售价"
    confirm: "<green>确定"
    cancel: "<red>取消"
    width: 300
    max-length: 32
