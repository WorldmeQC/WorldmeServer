# ============ 输入对话框 ============
dialogs:
  create:
    title: "<gold>创建公会"
    label: "<gray>公会名称"
    confirm: "<green>确定"
    cancel: "<red>取消"
    width: 300
    max-length: 16
  join:
    title: "<gold>加入公会"
    label: "<gray>公会名称"
    confirm: "<green>申请"
    cancel: "<red>取消"
    width: 300
    max-length: 16
  amount:
    title: "<gold>输入金额"
    label: "<gray>金额"
    confirm: "<green>确定"
    cancel: "<red>取消"
    width: 300
    max-length: 12
