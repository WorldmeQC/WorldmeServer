# ============ 通用背景 ============
background:
  fill: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

# ============ 公会主界面 ============
main:
  title: "<gold><bold>公会"
  rows: 4
  items:
    info:
      slot: 4
      material: WHITE_BANNER
      name: "<gold>%name%"
      lore:
        - "<gray>会长：<white>%leader%"
        - "<gray>等级：<yellow>%level%"
        - "<gray>成员：<white>%members%"
        - "<gray>资金：<yellow>%balance%"
        - "<gray>入会费：<yellow>%join_fee%"
        - "<gray>加入方式：%join_mode%"
    create:
      slot: 11
      material: WRITABLE_BOOK
      name: "<green>创建公会"
      lore:
        - "<gray>消耗 <yellow>%cost%</yellow> 金币"
        - "<yellow>点击输入公会名称"
    join:
      slot: 15
      material: PLAYER_HEAD
      name: "<yellow>加入公会"
      lore:
        - "<gray>输入公会名称申请加入"
    deposit:
      slot: 10
      material: HOPPER
      name: "<green>存入资金"
      lore:
        - "<gray>向公会金库存入金币"
        - "<yellow>点击输入金额"
    withdraw:
      slot: 12
      material: DROPPER
      name: "<yellow>取出资金"
      lore:
        - "<gray>从公会金库取出金币（需权限）"
        - "<yellow>点击输入金额"
    upgrade:
      slot: 13
      material: EXPERIENCE_BOTTLE
      name: "<light_purple>升级公会"
      lore:
        - "<gray>当前等级：<yellow>%level%/%max_level%"
        - "<gray>费用：<yellow>%upgrade_cost%"
        - "<gray>升级后领地自动扩建"
        - "<yellow>点击升级"
    members:
      slot: 14
      material: PLAYER_HEAD
      name: "<aqua>成员管理"
      lore:
        - "<gray>成员：<white>%members%"
        - "<yellow>点击查看"
    tp:
      slot: 16
      material: ENDER_PEARL
      name: "<green>传送到公会领地"
      lore:
        - "<gray>传送到公会领地传送点（若已设置）"
    leave:
      slot: 25
      material: OAK_DOOR
      name: "<red>退出公会"
      lore:
        - "<red>点击退出公会"
    disband:
      slot: 25
      material: TNT
      name: "<dark_red>解散公会"
      lore:
        - "<red>Shift+左键 确认解散"
    close:
      slot: 35
      material: BARRIER
      name: "<red>关闭"

