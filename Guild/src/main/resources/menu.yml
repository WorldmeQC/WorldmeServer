    material: PLAYER_HEAD
    name: "<aqua>%player%"
    lore:
      - "<gray>职级：<yellow>%rank%"
      - "<gray>状态：%status%"
      - ""
      - "<yellow>左键 提升为官员"
      - "<yellow>右键 降为成员"
      - "<red>Shift+左键 移出公会"
  items:
    info:
      slot: 4
      material: PAPER
      name: "<aqua>%name%"
      lore:
        - "<gray>成员：<white>%count%"
    back:
      slot: 49
      material: ARROW
      name: "<gray>返回公会界面"

