# ==================== 公会 ====================
guild:
  # 创建公会费用（Vault 金币）
  create-cost: 10000.0
  # 默认入会费，会长可调整
  default-join-fee: 0.0
  # 入会费最低值
  min-join-fee: 0.0
  # 入会费中归入公会金库的比例（0-1），其余部分作为系统回收
  fee-guild-share: 0.75
  # 入会未满多少天不可退会（0 表示不限制）
  no-leave-days: 7
  # 退会后重新入会的冷却小时数
  rejoin-cooldown-hours: 24
  # 公会资金操作快捷金额
  amount-presets: [1000, 10000, 100000]

  # 公会初始领地：以创建者所在位置为中心
  region:
    chunks-x: 3
    sections-y: 1
    chunks-z: 3

  # 成员上限：base + per-level * (level - 1)，0 表示不限制
  member-cap:
    base: 20
    per-level: 5

  # 升级
  level:
    max: 10
    # 从 1 级升到 2 级的基础费用，之后按 multiplier 递增
    upgrade-cost: 50000.0
    upgrade-cost-multiplier: 1.5
    # 每次升级自动扩建的区块数（向东、向南各扩展）
    expand-per-level: 1

